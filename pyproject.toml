[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-finance-briefing"
version = "0.1.0"
description = "Generate a daily Korean market summary as HTML and JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "finance-datareader>=0.9.90",
  "jinja2>=3.1",
  "pandas>=2.0",
]

[project.scripts]
daily-market-summary = "market_summary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
