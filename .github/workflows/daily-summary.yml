name: Daily market summary

on:
  schedule:
    - cron: "0 10 * * 1-6"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional report run date in YYYY-MM-DD format"
        required: false
        type: string
      target_date:
        description: "Optional market date to summarize in YYYY-MM-DD format"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: daily-market-summary
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    env:
      AS_OF: ${{ github.event.inputs.as_of || '' }}
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate report
        run: |
          args=()
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m market_summary "${args[@]}"

      - name: Reconcile generated files with latest main
        run: |
          git pull --rebase --autostash origin main

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily market summary"
            git fetch origin main
            git rebase origin/main

            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                break
              fi

              echo "Push failed because remote moved; rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
            done

            if [ "$pushed" != "true" ]; then
              echo "Failed to push generated report after retries."
              exit 1
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/reports

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
