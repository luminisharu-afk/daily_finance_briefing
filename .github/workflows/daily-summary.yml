name: Daily market summary

on:
  schedule:
    - cron: "0 10 * * 1-6"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional report run date in YYYY-MM-DD format"
        required: false
        type: string
      target_date:
        description: "Optional market date to summarize in YYYY-MM-DD format"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: daily-market-summary
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    env:
      AS_OF: ${{ github.event.inputs.as_of || '' }}
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate report
        run: |
          args=()
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m market_summary "${args[@]}"

      - name: Reconcile generated files with latest main
        run: |
          git pull --rebase --autostash origin main

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily market summary"
            git fetch origin main
            git rebase origin/main

            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                break
              fi

              echo "Push failed because remote moved; rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
            done

            if [ "$pushed" != "true" ]; then
              echo "Failed to push generated report after retries."
              exit 1
            fi
          fi

      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -L -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled or not accessible (HTTP $status). Enable Pages with Source = GitHub Actions in repository settings to publish rendered HTML."
          fi

      - name: Detect Pages setup token
        id: pages_token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$PAGES_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure existing Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Enable and configure Pages
        if: steps.pages.outputs.enabled != 'true' && steps.pages_token.outputs.available == 'true'
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          enablement: true

      - name: Skip Pages deployment
        if: steps.pages.outputs.enabled != 'true' && steps.pages_token.outputs.available != 'true'
        run: |
          echo "::notice::Generated files were committed to output/, but Pages deployment was skipped because the repository does not have Pages enabled. In Settings > Pages, set Source to GitHub Actions, then run this workflow again."

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true' || steps.pages_token.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/reports

      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true' || steps.pages_token.outputs.available == 'true'
        id: deploy_pages
        uses: actions/deploy-pages@v4
